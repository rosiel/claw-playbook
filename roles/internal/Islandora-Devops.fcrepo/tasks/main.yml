- ansible.builtin.include_tasks: install.yml
  tags:
    - fcrepo
    - fcrepo-install

- ansible.builtin.include_tasks: db-mysql.yml
  when: fcrepo_db_type == 'mysql' or fcrepo_persistence == 'jdbc-mysql'
  tags:
    - fedora
    - fedora-install
    - fedora-db

- ansible.builtin.include_tasks: db-pgsql.yml
  args:
    apply:
      become: yes
  when: fcrepo_db_type == 'postgresql' or fcrepo_persistence == 'jdbc-postgresql'
  tags:
    - fedora
    - fedora-install
    - fedora-db

- ansible.builtin.include_tasks: config.yml
  tags:
    - fcrepo
    - fcrepo-config
